version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: florasense_mysql
    restart: always
    environment:
      MYSQL_DATABASE: florasense
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: florauser
      MYSQL_PASSWORD: florapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    image: node:20
    container_name: florasense_web
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://florauser:florapassword@db:3306/florasense
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      - db

volumes:
  mysql_data:
